[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-api-chain"
version = "0.3.3"
description = "Pytest API call chains from Python observations and compiler instrumentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["pytest>=7,<10"]

[project.entry-points.pytest11]
"trace_api_chain.pytest_plugin" = "trace_api_chain.pytest_plugin"

[project.scripts]
trace-api-chain = "trace_api_chain.cli:main"
trace-changed-objects = "trace_api_chain.changed_objects:main"

[tool.setuptools]
packages = ["trace_api_chain"]
package-dir = { trace_api_chain = "src" }

[tool.setuptools.package-data]
trace_api_chain = ["*.c", "*.h", "contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
